name: Build Nebula

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      id-token: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore
      
      
      - name: Build and Package Nebula
        run: |
          dotnet pack -c Release /p:VersionSuffix="v${{ github.run_number }}" --output ./nupkg
      
      - name: Upload Raw DLL File
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-${{ github.run_number }}
          path: bin/Release/net6.0/Nebula.dll

         # relases the DLL 
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            bin/Release/net6.0/Nebula.dll
    
      
